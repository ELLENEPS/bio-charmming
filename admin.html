<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Charmming</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #333; margin-bottom: 20px; }
    label { display: block; margin: 15px 0 5px; font-weight: bold; color: #555; text-align: left; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { background: #24292e; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    button:hover { background: #000; }
    .btn-salvar { background: #ff4b72; }
    .btn-salvar:hover { background: #e03e61; }
    .hidden { display: none !important; }
    #mensagem { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <!-- TELA DE LOGIN COM GITHUB -->
    <div id="login-container">
      <h2>🔐 Painel Charmming</h2>
      <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Faça login com sua conta do GitHub para gerenciar o site.</p>
      <button id="btn-login-github">
        Entrar com o GitHub
      </button>
    </div>

    <!-- TELA DE EDIÇÃO -->
    <div id="admin-container" class="hidden">
      <h2>⚙️ Gerenciar Site</h2>
      <form id="config-form">
        <label>Número do WhatsApp:</label>
        <input type="text" id="whatsapp_input" required>
        
        <label>Texto do Cupom:</label>
        <textarea id="cupom_input" rows="3" required></textarea>
        
        <button type="submit" class="btn-salvar">Salvar Alterações</button>
      </form>
      <button id="btn-sair" style="background: #666; margin-top: 10px;">Sair</button>
    </div>

    <p id="mensagem"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://bdrzkcszwtskHqwmjcoa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_v12kV0bu91VsSmrUu2G2TQ_BMVZv...';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginContainer = document.getElementById('login-container');
    const adminContainer = document.getElementById('admin-container');
    const configForm = document.getElementById('config-form');
    const msg = document.getElementById('mensagem');

    async function verificarSessao() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        loginContainer.classList.add('hidden');
        adminContainer.classList.remove('hidden');
        carregarDadosAdmin();
      }
    }

    // Login via GitHub (Sem senha, sem email, clique único!)
    document.getElementById('btn-login-github').addEventListener('click', async () => {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: window.location.href
        }
      });
      if (error) {
        msg.style.color = 'red';
        msg.textContent = 'Erro ao autenticar com GitHub.';
      }
    });

    async function carregarDadosAdmin() {
      const { data } = await supabaseClient.from('site_config').select('chave, valor');
      if (data) {
        data.forEach(item => {
          if (item.chave === 'whatsapp_numero') document.getElementById('whatsapp_input').value = item.valor;
          if (item.chave === 'cupom_texto') document.getElementById('cupom_input').value = item.valor;
        });
      }
    }

    configForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novoZap = document.getElementById('whatsapp_input').value;
      const novoCupom = document.getElementById('cupom_input').value;

      await supabaseClient.from('site_config').update({ valor: novoZap }).eq('chave', 'whatsapp_numero');
      await supabaseClient.from('site_config').update({ valor: novoCupom }).eq('chave', 'cupom_texto');

      msg.style.color = 'green';
      msg.textContent = 'Alterações salvas com sucesso!';
      setTimeout(() => msg.textContent = '', 4000);
    });

    document.getElementById('btn-sair').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      location.reload();
    });

    verificarSessao();
  </script>
</body>
</html>
