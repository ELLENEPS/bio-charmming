  </main>

  <!-- Scripts -->
  <script>
    // Script para Copiar Cupom
    function copyCoupon() {
      const couponCode = "BEMVINDA";
      const btn = document.getElementById("copyBtn");
      
      navigator.clipboard.writeText(couponCode).then(() => {
        btn.classList.add("copied");
        btn.innerText = "Copiado!";
        
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerText = "copiar cupom";
        }, 2500);
      }).catch(err => {
        console.error("Erro ao copiar: ", err);
      });
    }

    // Toggle para expandir/recolher a caixinha de Rastreio
    function toggleTracking() {
      const content = document.getElementById("trackingContent");
      const chevron = document.getElementById("trackingChevron");
      content.classList.toggle("open");
      chevron.classList.toggle("open");
    }

    // Consulta de Rastreio na Serverless API
    async function fetchTracking() {
      const codeInput = document.getElementById("trackingCodeInput").value.trim();
      const carrierSelect = document.getElementById("carrierSelect").value;
      const resultDiv = document.getElementById("trackingResult");

      if (!codeInput) {
        resultDiv.innerHTML = `<p class="error-msg">Por favor, digite o código de rastreio.</p>`;
        return;
      }

      resultDiv.innerHTML = `<p class="loading-msg">Consultando rastreio...</p>`;

      try {
        const url = `/api/tracking?code=${encodeURIComponent(codeInput)}&service=${encodeURIComponent(carrierSelect)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (response.ok && data.TrackingEvents && data.TrackingEvents.length > 0) {
          let eventsHTML = `<div class="events-list">`;
          data.TrackingEvents.forEach(evt => {
            eventsHTML += `
              <div class="event-item">
                <div class="event-date">${evt.EventDateTime || ''}</div>
                <div class="event-desc"><strong>${evt.EventDescription || ''}</strong></div>
                <div class="event-location">${evt.EventLocation || ''}</div>
              </div>
            `;
          });
          eventsHTML += `</div>`;
          resultDiv.innerHTML = eventsHTML;
        } else {
          resultDiv.innerHTML = `<p class="error-msg">Nenhuma movimentação encontrada. Verifique a transportadora ou o código digitado.</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p class="error-msg">Erro ao realizar a busca. Tente novamente.</p>`;
      }
    }
  </script>
