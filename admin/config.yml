backend:
  name: github
  repo: ELLENEPS/bio-charmming
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "conteudo_site"
    label: "Gerenciar Site"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "index"
        fields:
          - label: "Cupom de Desconto (Texto)"
            name: "cupom_texto"
            widget: "string"
            hint: "Texto que aparece no banner rosa de desconto do topo"
          - label: "Número do WhatsApp"
            name: "whatsapp_numero"
            widget: "string"
            hint: "Exemplo: 5511976672214"