<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controle - Charmming</title>
</head>
<body>
  <!-- Script do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  
  <script>
    // Configuração injetada diretamente no JS para evitar erro 404 de arquivo externo
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "ELLENEPS/bio-charmming",
          branch: "main"
        },
        media_folder: "images",
        public_folder: "/images",
        collections: [
          {
            name: "conteudo_site",
            label: "Gerenciar Site",
            files: [
              {
                file: "index.html",
                label: "Página Principal",
                name: "index",
                fields: [
                  { label: "Cupom de Desconto (Texto)", name: "cupom_texto", widget: "string" },
                  { label: "Número do WhatsApp", name: "whatsapp_numero", widget: "string" }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
